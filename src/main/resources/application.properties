spring.application.name=spacely

spring.profiles.active=development
server.servlet.context-path=/api/v1

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/spacely_db
spring.datasource.username=spacely_user
spring.datasource.password=spacelysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# swagger properties

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=swagger-ui.html
springdoc.swagger-ui.operationSorter=method

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate

# Flyway Configuration
spring.flyway.enabled=false